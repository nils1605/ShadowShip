app:
  start_command: python -m uvicorn demo_app.main:app --port {port}
  asgi_app: demo_app.main:app
  health_path: /health
  baseline_port: 8001
  candidate_port: 8002
  startup_timeout_seconds: 20.0
diff:
  ignore_fields:
  - id
  - cart_id
  - created_at
  - timestamp
  latency_threshold_pct: 50.0
  latency_min_increase_ms: 100.0
judge:
  promote_threshold: 80
llm:
  enabled: true
  model: claude-opus-5-5
  effort: low
journeys_dir: journeys
reports_dir: reports
generated_tests_dir: tests/generated
worktrees_dir: .shadowship
