[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowship"
version = "0.1.0"
description = "Agents that rehearse your release before it ships."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "deepdiff>=7",
    "pyyaml>=6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shadowship = "shadowship.cli:app"

[tool.setuptools.packages.find]
include = ["shadowship*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
